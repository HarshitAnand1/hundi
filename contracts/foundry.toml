[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# OpenZeppelin v5.7 uses mcopy, so Cancun is required. [VERIFY] HSK Chain supports Cancun opcodes.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
hsk_testnet = "${HSK_TESTNET_RPC_URL}"
hsk_mainnet = "${HSK_RPC_URL}"
